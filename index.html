<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#262b52" />
    <meta name="description" content="COLOR ME BACK! — a gentle 3D adventure where children bring the colors home." />
    <title>Color Me Back!</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='22' cy='26' r='14' fill='%23EF4444'/%3E%3Ccircle cx='42' cy='26' r='14' fill='%233B82F6' fill-opacity='.85'/%3E%3Ccircle cx='32' cy='42' r='14' fill='%23FACC15' fill-opacity='.85'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Color Me Back 3D world" tabindex="-1"></canvas>
      <div id="letterbox" aria-hidden="true"><div></div><div></div></div>
      <div id="hud" class="hidden" aria-live="off"></div>
      <div id="prompt" class="hidden" role="status" aria-live="polite"></div>
      <div id="captions" aria-live="polite"></div>
      <div id="dialogue" class="hidden" role="dialog" aria-live="polite" aria-label="Story dialogue"></div>
      <div id="toasts" role="status" aria-live="polite"></div>
      <div id="screens"></div>
      <div id="touch" class="hidden" aria-hidden="true"></div>
      <div id="fade" aria-hidden="true"></div>
      <div id="boot" role="status">
        <div class="boot-dots"><span></span><span></span><span></span></div>
        <p>Mixing the paints…</p>
      </div>
      <noscript>COLOR ME BACK! needs JavaScript and WebGL to play.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
